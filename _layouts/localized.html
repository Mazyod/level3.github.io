<!DOCTYPE html>
<html lang="{{ page.lang }}">
  {% include head.html %}
  {% assign text = site.data.locales[page.lang] %}
  <body>
    <header class="site-header">
      <div class="wrapper">
        <a class="site-title" href="/{{ page.lang }}/">Level3 Games</a>
        <nav style="clear: both; padding-bottom: 12px;">
          <a href="/{{ page.lang }}/faq/">{{ text.help }}</a> ·
          <a href="/{{ page.lang }}/privacy-policy/">{{ text.title-privacy }}</a>
        </nav>
      </div>
    </header>
    <main class="page-content">
      <div class="wrapper">
        <p><a lang="en" hreflang="en" href="/{{ page.section }}">English</a> · <a lang="tr" hreflang="tr" href="/tr/{{ page.section }}">Türkçe</a> · <a lang="es" hreflang="es" href="/es/{{ page.section }}">Español</a></p>
        {{ content }}
      </div>
    </main>
    <footer class="site-footer">
      <div class="wrapper">
        <p><a href="mailto:support@level3.io">{{ text.contact }}</a> · <a href="https://auth.level3.io/account-deletion?lang={{ page.lang }}">{{ text.delete }}</a></p>
        <p><a hreflang="en" href="/about/">{{ text.about-english }}</a> · <a hreflang="en" href="/terms-of-service/">{{ text.terms-english }}</a></p>
      </div>
    </footer>
  </body>
</html>
